apiVersion: v1
kind: Pod
metadata:
  name: db-pod
  namespace: db-nmspc
  labels:
    app: db
spec:
  imagePullSecrets:
    - name: ecr-registry-key
  containers:
    - name: db
      image: 141947217581.dkr.ecr.us-east-1.amazonaws.com/sql-database-repo:version1
      imagePullPolicy: Always
      ports:
        - containerPort: 3306
      env:
        - name: MYSQL_ROOT_PASSWORD
          value: pw